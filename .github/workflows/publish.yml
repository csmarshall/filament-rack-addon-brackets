name: Publish

# On every push to main: redraw every blueprint sheet and its README embed, then cut a release from the branch tip, so the
# release always carries the drawing CI just rendered (issue #11). Both steps are common-blueprint-generator's reusable workflows.
# Every merge is a patch release; run this workflow by hand (Actions > Publish > Run workflow) to pick a minor or major bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  blueprint:
    uses: csmarshall/common-blueprint-generator/.github/workflows/render.yml@v1
    with:
      # The layouts are hand-placed in the make_blueprint*.py scripts (sections, chain dimensions, details), so it runs those scripts instead of the
      # CLI: the in-line, staggered, end bracket and coupon sheets in shared-wall-bracket, and the wall plate sheet in anti-tip-wall-plate.
      # cadquery brings its own OCP 7.9; the generator is installed without the ocp extra so it uses that one.
      render-command: >-
        uv venv -q .venv &&
        uv pip install -q --python .venv -r requirements.txt "$BLUEPRINT_PACKAGE" &&
        (cd shared-wall-bracket &&
        ../.venv/bin/python make_blueprint.py &&
        ../.venv/bin/python make_blueprint_staggered.py &&
        ../.venv/bin/python make_blueprint_end.py &&
        ../.venv/bin/python make_blueprint_coupon.py &&
        ../.venv/bin/python make_preview.py) &&
        (cd anti-tip-wall-plate && ../.venv/bin/python make_blueprint.py && ../.venv/bin/python make_preview.py)
      commit-paths: >-
        shared-wall-bracket/blueprint.svg shared-wall-bracket/blueprint_staggered.svg shared-wall-bracket/blueprint_end.svg
        shared-wall-bracket/blueprint_coupon.svg shared-wall-bracket/preview.svg shared-wall-bracket/README.md
        anti-tip-wall-plate/blueprint.svg anti-tip-wall-plate/preview.svg anti-tip-wall-plate/README.md

  release:
    needs: blueprint
    uses: csmarshall/common-blueprint-generator/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump || 'patch' }}
      # The prints archive: every part's models, the drawing and the part READMEs, with the print settings and disclaimer.
      # The shared workflow adds the licences, REUSE.toml and the root README itself.
      prints-paths: >-
        shared-wall-bracket/models anti-tip-wall-plate/models
        shared-wall-bracket/blueprint.svg shared-wall-bracket/blueprint_staggered.svg shared-wall-bracket/blueprint_end.svg
        shared-wall-bracket/blueprint_coupon.svg anti-tip-wall-plate/blueprint.svg
        shared-wall-bracket/preview.svg anti-tip-wall-plate/preview.svg
        shared-wall-bracket/README.md anti-tip-wall-plate/README.md
        PRINT_SETTINGS.md DISCLAIMER.md
