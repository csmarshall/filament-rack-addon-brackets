# Cut a release on every push to main.
#
# The major and minor version are set by hand in the VERSION file (for example
# "1.0").  The patch number is automatic: one higher than the newest existing
# tag for that major.minor, starting at 0.  To cut 1.1.0 or 2.0.0, edit VERSION
# and push.  Put "[skip release]" in a commit message to push without a release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR, got '$base'" >&2
            exit 1
          fi
          git fetch --tags --quiet
          last="$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${base}.${patch} (previous patch: ${last:-none})"

      - name: Build the archives
        run: python3 tools/make_release.py --version "${{ steps.version.outputs.version }}" --out dist

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist/*.zip \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
