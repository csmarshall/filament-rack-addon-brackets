# Cut a release.
#
# Every push to main cuts a patch release: one higher than the newest vX.Y.Z
# tag.  Major and minor bumps are a deliberate manual choice: run this workflow
# by hand (Actions > Release > Run workflow) and pick "minor" or "major".
# Put "[skip release]" in a commit message to push without a release.
#
# This local workflow is a stand-in for the shared release workflow in
# common-blueprint-generator.  When that lands, replace this file with a call
# to it; the two must not both run, or every push would cut two releases.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        options: [minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          last="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$last" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              patch) next="${major}.${minor}.$((patch + 1))" ;;
              *) echo "unknown bump '$BUMP'" >&2; exit 1 ;;
            esac
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${next} (${BUMP} bump; previous: ${last:-none})"

      - name: Build the archives
        run: python3 tools/make_release.py --version "${{ steps.version.outputs.version }}" --out dist

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist/*.zip \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
